<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4d1d18" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>输入框键盘 bug 复现</title>
<style>
  :root { --app-h: 100dvh; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #2a2220; }
  body { font: 14px/1.5 system-ui, sans-serif; color: #333; overscroll-behavior: none; }

  .app { display: flex; flex-direction: column; width: 100%; height: var(--app-h); overflow: hidden; }

  .topbar { flex: 0 0 auto; padding: 10px 14px; background: #4d1d18; color: #fff; font-size: 13px; }
  .topbar b { display: block; margin-bottom: 4px; }
  .modebar { flex: 0 0 auto; display: flex; gap: 6px; padding: 8px 10px; background: #eee; overflow-x: auto; }
  .modebar button { flex: 0 0 auto; padding: 6px 10px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-size: 11px; }
  .modebar button.active { background: #4d1d18; color: #fff; border-color: #4d1d18; }

  .stream { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; background: #f5efe6; -webkit-overflow-scrolling: touch; }
  .msg { max-width: 80%; margin: 0 0 12px; padding: 10px 13px; background: #fff; border: 1px solid #ddc9b1; border-radius: 13px 13px 13px 3px; }
  .msg.mine { margin-left: auto; background: #f0d9d1; border-radius: 13px 13px 3px 13px; }

  /* composer：目前几种方案通过 body 的 data-mode 属性切换 */
  .composer { flex: 0 0 auto; display: flex; gap: 8px; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); background: #fffaf0; border-top: 1px solid #ddc9b1; }

  body[data-mode="fixed"] .app { height: 100dvh; }
  body[data-mode="fixed"] .stream { padding-bottom: 76px; }
  body[data-mode="fixed"] .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; }

  .composer input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid #d8c0a8; border-radius: 10px; font-size: 14px; }
  .composer button { padding: 0 16px; border: 0; border-radius: 10px; background: #4d1d18; color: #fff; font-size: 13px; }

  .status { flex: 0 0 auto; padding: 6px 12px; background: #333; color: #9f9; font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body data-mode="viewport-js">
  <div class="app" id="app">
    <div class="topbar">
      <b>输入框 / 软键盘复现 demo</b>
      加到手机主屏幕（standalone）后测试，和直接用浏览器 tab 打开对比。点下面按钮切换不同的处理方案。
    </div>
    <div class="modebar" id="modebar"></div>
    <div class="stream" id="stream"></div>
    <div class="composer">
      <input id="input" type="text" placeholder="点这里弹出键盘，试试输入…" />
      <button id="send">发送</button>
    </div>
    <div class="status" id="status">status: 加载中…</div>
  </div>

<script>
const modes = [
  { id: 'viewport-js', label: 'A. visualViewport JS 撑高度（当前线上方案）' },
  { id: 'interactive-widget', label: 'B. viewport interactive-widget（纯 CSS，曾试过又回退）' },
  { id: 'fixed', label: 'C. composer fixed 定位在页面底部（朋友建议的思路）' },
  { id: 'plain', label: 'D. 什么都不做，只用 100dvh 兜底（对照组）' },
]

const modebar = document.getElementById('modebar')
const statusEl = document.getElementById('status')
const stream = document.getElementById('stream')
const app = document.getElementById('app')

modes.forEach(m => {
  const btn = document.createElement('button')
  btn.textContent = m.label
  btn.dataset.mode = m.id
  btn.onclick = () => setMode(m.id)
  modebar.appendChild(btn)
})

function setMode(id) {
  document.body.dataset.mode = id
  localStorage.setItem('repro-mode', id)
  ;[...modebar.children].forEach(b => b.classList.toggle('active', b.dataset.mode === id))
  applyViewportMeta(id)
  log(`切到方案 ${id}`)
}

// viewport meta 的 interactive-widget 只有页面加载时读一次，方案 B 需要重新设置再提示手动刷新一次
function applyViewportMeta(id) {
  const meta = document.querySelector('meta[name="viewport"]')
  const base = 'width=device-width, initial-scale=1.0, viewport-fit=cover'
  const wanted = id === 'interactive-widget' ? `${base}, interactive-widget=resizes-content` : base
  if (meta.content !== wanted) {
    meta.content = wanted
    log('⚠️ viewport meta 已改，interactive-widget 通常要刷新页面才生效，请手动刷新')
  }
}

// 方案 A：visualViewport JS 撑高度（当前蛋窝线上用的办法）
function setupViewportJS() {
  const vv = window.visualViewport
  if (!vv) { log('这个浏览器没有 visualViewport API'); return }
  const apply = () => {
    document.documentElement.style.setProperty('--app-h', `${Math.round(vv.height)}px`)
    log(`viewport resize: height=${Math.round(vv.height)} offsetTop=${Math.round(vv.offsetTop)} mode=${document.body.dataset.mode}`)
  }
  apply()
  vv.addEventListener('resize', apply)
  vv.addEventListener('scroll', apply)
}

function log(text) {
  const t = new Date().toLocaleTimeString()
  statusEl.textContent = `[${t}] ${text}\n` + statusEl.textContent.split('\n').slice(0, 8).join('\n')
}

for (let i = 1; i <= 20; i++) {
  const div = document.createElement('div')
  div.className = 'msg' + (i % 2 === 0 ? ' mine' : '')
  div.textContent = `消息 ${i}：滚动到底部，然后点输入框弹键盘看效果`
  stream.appendChild(div)
}
stream.scrollTop = stream.scrollHeight

document.getElementById('send').onclick = () => {
  const input = document.getElementById('input')
  if (!input.value.trim()) return
  const div = document.createElement('div')
  div.className = 'msg mine'
  div.textContent = input.value
  stream.appendChild(div)
  input.value = ''
  requestAnimationFrame(() => { stream.scrollTop = stream.scrollHeight })
}

setupViewportJS()
const saved = localStorage.getItem('repro-mode') || 'viewport-js'
setMode(saved)
log('页面加载完成。记得先「添加到主屏幕」，从桌面图标打开才能复现（浏览器 tab 里通常没问题）。')
</script>
</body>
</html>
